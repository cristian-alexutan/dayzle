name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dayzle
          POSTGRES_USER: dayzle
          POSTGRES_PASSWORD: dayzle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayzle -d dayzle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://dayzle:dayzle@localhost:5432/dayzle

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Check Django can reach the database
        run: python manage.py migrate --noinput

      - name: Pytest
        # Exit code 5 means "no tests collected", which is expected until tests are written.
        run: pytest || [ $? -eq 5 ]
